 else if(a==='buy'){const e=SHOP[+p];if(e[2]>SAVE.up.arm){bad('무기고를 먼저 올려야 해요');return;}if(SAVE.bp<e[1]){bad('BP가 부족해요');return;}const it=mk(e[0],e[3]||1),left=bagAdd(SAVE.stash,STASHCAP[SAVE.up.stash],it);if(left>=it.q&&left>0){bad('창고가 가득 찼어요');return;}SAVE.bp-=e[1];sfx.buy();}
 else if(a==='upg'){const u=UPG.find(x=>x.k===p),nx=u.lv[SAVE.up[p]];if(!nx)return;if(SAVE.bp<nx.bp||!nx.req.every(r=>bagCount(SAVE.stash,r[0])>=r[1])){bad('BP나 재료가 부족해요');return;}SAVE.bp-=nx.bp;for(const r of nx.req)bagTake(SAVE.stash,r[0],r[1]);SAVE.up[p]++;sfx.rare();if(isHide()){hideDyn();R.cont=M.stations.slice();R.P.maxhp=R.P.hp=100+SAVE.up.med*15;}save();rer();note(u.n+' 건설 완료! 은신처에 생겼어요',1);return;}
 else if(a==='claim'){const q=QUEST.find(x=>x.id===p);if(SAVE.qc[q.id]||qProg(q)<q.goal){sfx.bad();return;}if(q.type==='give')bagTake(SAVE.stash,q.item,q.goal);SAVE.qc[q.id]=1;SAVE.bp+=q.rew.bp;for(const r of q.rew.items)bagAdd(SAVE.stash,999,mk(r[0],r[1]));sfx.rare();rer();note('보상을 창고에 넣었어요',1);save();return;}
 else if(a==='tidy'){let n=0;for(let i=SAVE.bag.length-1;i>=0;i--){const t=IT[SAVE.bag[i].id].t;if(t==='ammo'||t==='med')continue;const it=SAVE.bag[i],left=bagAdd(SAVE.stash,STASHCAP[SAVE.up.stash],it);if(left===0){SAVE.bag.splice(i,1);n++;}else{it.q=left;break;}}SEL=null;rer();if(n){sfx.pick();note(n+'개를 창고로 옮겼어요',1);}else bad('옮길 전리품이 없거나 창고가 가득 찼어요');save();return;}
 else if(a==='refill'){const cap=bagCap(SAVE.eq),want=[];for(const k of['w1','w2']){const w=SAVE.eq[k];if(w&&!WP[w.id].melee){const am=WP[w.id].am;if(!want.find(x=>x[0]===am))want.push([am,am==='a12'?20:WP[w.id].mag*3]);}}want.push(['bandage',3],['firstaid',1]);let n=0;
  for(const[id,q]of want){let need=q-bagCount(SAVE.bag,id);while(need>0){const i=SAVE.stash.findIndex(x=>x.id===id);if(i<0)break;const s=SAVE.stash[i],m=Math.min(need,s.q),moved=m-bagAdd(SAVE.bag,cap,{id,q:m});if(moved<=0)break;s.q-=moved;if(!s.q)SAVE.stash.splice(i,1);need-=moved;n+=moved;}}SEL=null;rer();if(n){sfx.pick();note('창고에서 탄약과 회복 아이템을 채웠어요',1);}else bad('창고에 채울 보급품이 없어요. 상점에서 살 수 있어요');save();return;}
 else if(a==='raid'){save();goRaid();return;}
 else if(a==='start'){tryFS();sfx.click();enterHide();return;}
 else if(a==='hub'){enterHide();return;}
 else if(a==='mute'){setMute(!muted);if(UIM==='pause')uiPause();else uiTitle();return;}
 else if(a==='reset'){if(!resetArm){resetArm=1;uiTitle();return;}try{localStorage.removeItem('pocketext_v1');}catch(e){}location.reload();return;}
 else if(a==='resume'){R.paused=false;uiClose();return;}
 else if(a==='quit'){R.paused=false;uiClose();msg('작전을 포기했어요','#ff8a80');endRaid(false);return;}
 if(!inRaid())save();rer();}
function run(f){try{f();}catch(err){window.__err=String(err&&err.stack||err);}}
function clickItem(z,i){if(inRaid()&&z==='out'){takeFrom(lootList(),+i);rer();return;}if(isSel(z,i)){primary(z,i);return;}SEL={z,i};sfx.click();rer();}
UI.addEventListener('click',e=>{hideCtx();if(lpFired){lpFired=false;return;}const b=e.target.closest('[data-a]');if(b){ainit();run(()=>doAct(b.dataset.a,b.dataset.p));return;}const t=e.target.closest('.it[data-z]');if(t){ainit();run(()=>clickItem(t.dataset.z,t.dataset.i));}});
HB.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){ainit();run(()=>doAct(b.dataset.a,b.dataset.p));}});
CTX.addEventListener('click',e=>{const b=e.target.closest('[data-a]');hideCtx();if(b&&SEL)run(()=>doAct(b.dataset.a));});
addEventListener('pointerdown',e=>{if(CTX.style.display==='block'&&!CTX.contains(e.target))hideCtx();},true);
UI.addEventListener('contextmenu',e=>{e.preventDefault();const t=e.target.closest('.it[data-z]');if(!t)return;SEL={z:t.dataset.z,i:t.dataset.i};run(()=>{rer();showCtx(e.clientX,e.clientY);});});
UI.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const t=e.target.closest('.it[data-z]');clearTimeout(lpT);if(!t)return;const z=t.dataset.z,i=t.dataset.i,x=e.clientX,y=e.clientY;lpT=setTimeout(()=>{lpFired=true;SEL={z,i};run(()=>{rer();showCtx(x,y-10);});},480);});
for(const ev of['pointerup','pointercancel','pointermove'])UI.addEventListener(ev,e=>{if(ev!=='pointermove'||Math.abs(e.movementX)+Math.abs(e.movementY)>6)clearTimeout(lpT);});
UI.addEventListener('mouseover',e=>{if(TOUCH||DRAG)return;const t=e.target.closest('.it[data-z]');if(!t){HOV=null;hideTip();return;}HOV={z:t.dataset.z,i:t.dataset.i};const it=itemAt(HOV.z,HOV.i);if(!it)return;TIP.innerHTML=tipHTML(it,HOV.z);place(TIP,e.clientX+16,e.clientY+14);});
UI.addEventListener('mousemove',e=>{if(TIP.style.display==='block')place(TIP,e.clientX+16,e.clientY+14);});
UI.addEventListener('mouseleave',()=>{HOV=null;hideTip();});
function dropZone(t){if(!t||!t.closest)return null;const a=t.closest('.it[data-z]');if(a)return{z:a.dataset.z,i:a.dataset.i};const b=t.closest('[data-drop]');return b?{z:b.dataset.drop,i:b.dataset.i}:null;}
UI.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('.it[data-z]');if(!t){e.preventDefault();return;}DRAG={z:t.dataset.z,i:t.dataset.i};t.classList.add('drag');hideTip();hideCtx();try{e.dataTransfer.setData('text/plain','x');e.dataTransfer.effectAllowed='move';}catch(_){}});
UI.addEventListener('dragover',e=>{if(DRAG&&dropZone(e.target))e.preventDefault();});
UI.addEventListener('drop',e=>{if(!DRAG)return;e.preventDefault();const d=dropZone(e.target),s=DRAG;DRAG=null;if(d)run(()=>dropMove(s,d));});
UI.addEventListener('dragend',()=>{DRAG=null;UI.querySelectorAll('.drag').forEach(x=>x.classList.remove('drag'));});
// hover hotkeys inside the inventory
function uiKey(e){if(e.repeat||(UIM!=='hub'&&UIM!=='loot'))return;const c=e.code;if(UIM==='loot'&&c==='KeyF'){run(()=>{if(lootList().length)doAct('takeall');else closeLoot();});return;}
 if(!HOV||!itemAt(HOV.z,HOV.i))return;const a=acts(HOV.z,HOV.i),k=c==='KeyE'?'E':c==='KeyG'||c==='Delete'?'G':c==='KeyZ'?'Z':c==='KeyS'?'S':null;if(!k)return;const hit=a.find(x=>x[3]===k);if(hit){const at=HOV;HOV=null;hideTip();run(()=>doAct(hit[1],null,at));}}
addEventListener('pointerup',e=>{if(e.button===2)mouse.rdown=false;else mouse.down=false;});
// ---- main loop ----
let lastTs=0,tbState='',hbState=null;
function syncTouch(){const sc=SCREEN==='raid'||SCREEN==='hide',on=sc&&TOUCH&&!UIM&&!R.over&&!R.bigmap,c=on&&R.near?(R.near.kind==='st'?(R.near.st==='deploy'?'출격':'열기'):R.near.opened?'열기':'수색'):'',k=(on?1:0)+c+SCREEN;
 if(k!==tbState){tbState=k;TBE.style.display=on?'block':'none';TBE.className=SCREEN==='hide'?'hide':'';const b=$('bAct');b.style.display=c?'flex':'none';b.textContent=c;}
 const hb=SCREEN==='hide'&&!UIM;if(hb!==hbState){hbState=hb;HB.style.display=hb?'flex':'none';}cv.style.cursor=sc&&!UIM&&!TOUCH?'none':'default';}
function frame(ts){const dt=Math.min(.05,Math.max(0,(ts-lastTs)/1000)||0);lastTs=ts;
 try{pollInput();if(window.PE&&PE.bot)PE.bot(IN);
  if(SCREEN==='raid'||SCREEN==='hide'){
   if(UIM==='loot'){if(IN.bag||IN.pause)closeLoot();IN.bag=IN.pause=IN.act=false;}
   else if(UIM==='hub'){if(IN.bag||IN.pause)closeHub();IN.bag=IN.pause=IN.act=false;}
   else if(UIM==='pause'){if(IN.pause){R.paused=false;uiClose();}IN.pause=false;}
   else if(IN.pause&&!R.over&&SCREEN==='raid'){if(R.bigmap)R.bigmap=false;else uiPause();}
   updRaid(dt);renderRaid();}
  else if(SCREEN==='title'){g.setTransform(DPR*SC,0,0,DPR*SC,0,0);drawTitleArt(ts/1000);}
  syncTouch();endInput();}catch(err){window.__err=String(err&&err.stack||err);}
 requestAnimationFrame(frame);}
addEventListener('visibilitychange',()=>{if(document.hidden&&SCREEN==='raid'&&R&&!R.over&&!R.paused&&!UIM)uiPause();});
addEventListener('resize',()=>{if(UIM==='hub'||UIM==='loot')rer();if(SCREEN==='hide')renderHB();});
buildMini(MAPR);uiTitle();
window.PE={get R(){return R;},get SAVE(){return SAVE;},get SCREEN(){return SCREEN;},get M(){return M;},get UIM(){return UIM;},MAPR,MAPH,IN,keys,bot:null,go:goRaid,act:doAct,frame,step(n,dt){for(let i=0;i<n;i++){pollInput();if(PE.bot)PE.bot(IN);updRaid(dt||1/60);endInput();}},path:pathFind,los};
requestAnimationFrame(frame);
