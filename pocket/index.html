function bagAdd(bag,cap,it){const i=IT[it.id];let q=it.q;if(i.st>1){for(const b of bag)if(b.id===it.id&&b.q<i.st){const m=Math.min(q,i.st-b.q);b.q+=m;q-=m;if(!q)return 0;}while(q>0&&bag.length<cap){const m=Math.min(q,i.st);bag.push({id:it.id,q:m});q-=m;}return q;}if(bag.length<cap){bag.push(it);return 0;}return q;}
function bagCount(bag,id){let n=0;for(const b of bag)if(b.id===id)n+=b.q;return n;}

function takeFrom(list,i){const o=O(),it=list[i];if(!it)return;const d=IT[it.id];
 if(d.t==='w'&&(!o.eq.w1||!o.eq.w2)){list.splice(i,1);o.eq[o.eq.w1?'w2':'w1']=it;sfx.pick();return;}
 if((d.t==='vest'||d.t==='helm'||d.t==='pack')&&!o.eq[d.t]){list.splice(i,1);o.eq[d.t]=it;sfx.pick();return;}
 const left=bagAdd(o.bag,bagCap(o.eq),it);if(left===0){list.splice(i,1);sfx.pick();}else if(left<it.q){it.q=left;sfx.pick();}else{sfx.bad();note('가방이 가득 찼어요');}}
function sendOut(it){if(inRaid()){putOut(it);return true;}const left=bagAdd(SAVE.stash,STASHCAP[SAVE.up.stash],it);if(left>0){it.q=left;sfx.bad();note('창고가 가득 찼어요');return false;}return true;}
function bagOut(i){const o=O(),it=o.bag[i];if(it&&sendOut(it)){o.bag.splice(i,1);sfx.click();}}
function equipBag(i){const o=O(),it=o.bag[i],d=IT[it.id];
 if(d.t==='w'){const t=!o.eq.w1?'w1':!o.eq.w2?'w2':(inRaid()&&R.P.slot===1?'w2':'w1'),old=o.eq[t];o.bag.splice(i,1);o.eq[t]=it;if(old)o.bag.push(old);if(inRaid())R.P.rel=0;sfx.pick();}
 else if(d.t==='vest'||d.t==='helm'){const old=o.eq[d.t];o.bag.splice(i,1);o.eq[d.t]=it;if(old)o.bag.push(old);sfx.pick();}
 else if(d.t==='pack'){const old=o.eq.pack;if(o.bag.length-1+(old?1:0)>d.slots+SAVE.up.bench*2){sfx.bad();note('이 배낭에는 지금 물건이 다 안 들어가요');return;}o.bag.splice(i,1);o.eq.pack=it;if(old)o.bag.push(old);sfx.pick();}}
function unequip(k){const o=O(),it=o.eq[k];if(!it)return;if(k==='pack'){if(o.bag.length>6+SAVE.up.bench*2){sfx.bad();note('배낭을 벗으려면 물건을 먼저 줄여야 해요');return;}if(sendOut(it))o.eq.pack=null;return;}
 if(o.bag.length<bagCap(o.eq)){o.eq[k]=null;o.bag.push(it);sfx.pick();}else if(sendOut(it)){o.eq[k]=null;sfx.pick();}if(inRaid())R.P.rel=0;}
function toPouch(i){const o=O();if(o.pouch){const old=o.pouch;o.pouch=o.bag[i];o.bag[i]=old;}else o.pouch=o.bag.splice(i,1)[0];sfx.pick();}
function fromPouch(){const o=O();if(!o.pouch)return;if(o.bag.length<bagCap(o.eq)){o.bag.push(o.pouch);o.pouch=null;sfx.pick();}else if(sendOut(o.pouch)){o.pouch=null;sfx.pick();}}

 show('<div class="scr"><div class="cen">'+s+'<div class="btn y big" data-a="hub">기지로 돌아가기</div></div></div>');}
function tryFS(){try{const el=document.documentElement;if(TOUCH&&!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen({navigationUI:'hide'}).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}}
function goRaid(){tryFS();uiClose();SCREEN='raid';startRaid();if(!SAVE.tut){SAVE.tut=1;save();msg(TOUCH?'상자 옆에서 수색 버튼을 꾹 누르면 열려요':'상자 옆에서 F를 꾹 누르면 열려요','#ffcf4a');}}
function doAct(a,p){const o=O();
 if(a==='tab'){TAB=p;SEL=null;sfx.click();}
 else if(a==='sel'){const[s,i]=p.split(':'),pp=s==='eq'?i:+i;if(isSel(s,pp)){const f=selActs()[0];if(f)return doAct(f[1]);}SEL={s,p:pp};sfx.click();}
 else if(a==='take'){if(inRaid())takeFrom(lootList(),+p);else{takeFrom(SAVE.stash,SEL.p);SEL=null;}}
 else if(a==='takeall'){const l=lootList();for(let i=l.length-1;i>=0;i--){const n=l.length,q=l[i].q;takeFrom(l,i);if(l.length===n&&l[i].q===q)break;}}
 else if(a==='close'){closeLoot();return;}
 else if(a==='equip'){equipBag(SEL.p);SEL=null;}
 else if(a==='use'){const id=o.bag[SEL.p].id;closeLoot();startUse(id);return;}
 else if(a==='out'){bagOut(SEL.p);SEL=null;}
 else if(a==='pouch'){toPouch(SEL.p);SEL=null;}
 else if(a==='unpouch'){fromPouch();SEL=null;}
 else if(a==='uneq'){unequip(SEL.p);SEL=null;}
 else if(a==='sell'){const it=SAVE.stash[SEL.p];if(it){SAVE.bp+=itVal(it);SAVE.stash.splice(SEL.p,1);sfx.buy();}SEL=null;}
 else if(a==='sellall'){let v=0;for(let i=SAVE.stash.length-1;i>=0;i--)if(IT[SAVE.stash[i].id].t==='val'){v+=itVal(SAVE.stash[i]);SAVE.stash.splice(i,1);}SEL=null;if(v){SAVE.bp+=v;sfx.buy();rer();note('+'+v.toLocaleString()+' BP',1);save();return;}else{sfx.bad();rer();note('팔 전리품이 없어요');return;}}
 else if(a==='buy'){const e=SHOP[+p];if(e[2]>SAVE.up.arm){sfx.bad();note('무기고를 먼저 올려야 해요');return;}if(SAVE.bp<e[1]){sfx.bad();note('BP가 부족해요');return;}const it=mk(e[0],e[3]||1),left=bagAdd(SAVE.stash,STASHCAP[SAVE.up.stash],it);if(left>=it.q&&left>0){sfx.bad();note('창고가 가득 찼어요');return;}SAVE.bp-=e[1];sfx.buy();}
 else if(a==='upg'){const u=UPG.find(x=>x.k===p),nx=u.lv[SAVE.up[p]];if(!nx)return;if(SAVE.bp<nx.bp||!nx.req.every(r=>bagCount(SAVE.stash,r[0])>=r[1])){sfx.bad();note('BP나 재료가 부족해요');return;}SAVE.bp-=nx.bp;for(const r of nx.req)bagTake(SAVE.stash,r[0],r[1]);SAVE.up[p]++;sfx.rare();}
 else if(a==='claim'){const q=QUEST.find(x=>x.id===p);if(SAVE.qc[q.id]||qProg(q)<q.goal){sfx.bad();return;}if(q.type==='give')bagTake(SAVE.stash,q.item,q.goal);SAVE.qc[q.id]=1;SAVE.bp+=q.rew.bp;for(const r of q.rew.items)bagAdd(SAVE.stash,999,mk(r[0],r[1]));sfx.rare();rer();note('보상을 창고에 넣었어요',1);save();return;}
 else if(a==='tidy'){let n=0;for(let i=SAVE.bag.length-1;i>=0;i--){const t=IT[SAVE.bag[i].id].t;if(t==='ammo'||t==='med')continue;const it=SAVE.bag[i],left=bagAdd(SAVE.stash,STASHCAP[SAVE.up.stash],it);if(left===0){SAVE.bag.splice(i,1);n++;}else{it.q=left;break;}}SEL=null;rer();if(n){sfx.pick();note(n+'개를 창고로 옮겼어요',1);}else note('옮길 전리품이 없거나 창고가 가득 찼어요');save();return;}
 else if(a==='raid'){save();goRaid();return;}
 else if(a==='start'){tryFS();sfx.click();uiHub();return;}
 else if(a==='hub'){TAB='go';SEL=null;uiHub();return;}
 else if(a==='mute'){setMute(!muted);if(UIM==='pause')uiPause();else uiTitle();return;}
 else if(a==='reset'){if(!resetArm){resetArm=1;uiTitle();return;}try{localStorage.removeItem('pocketext_v1');}catch(e){}location.reload();return;}
 else if(a==='resume'){R.paused=false;uiClose();return;}
 else if(a==='quit'){R.paused=false;uiClose();msg('작전을 포기했어요','#ff8a80');endRaid(false);return;}
 if(!inRaid())save();rer();}
UI.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;ainit();try{doAct(t.dataset.a,t.dataset.p);}catch(err){window.__err=String(err&&err.stack||err);}});
addEventListener('pointerup',()=>{mouse.down=false;});
// ---- main loop ----
let lastTs=0,tbState='';
function syncTouch(){const on=SCREEN==='raid'&&TOUCH&&!R.loot&&!R.paused&&!R.over,c=on&&R.near?(R.near.opened?'열기':'수색'):'',k=(on?1:0)+c;if(k===tbState)return;tbState=k;TBE.style.display=on?'block':'none';const b=$('bAct');b.style.display=c?'flex':'none';b.textContent=c;}
function frame(ts){const dt=Math.min(.05,Math.max(0,(ts-lastTs)/1000)||0);lastTs=ts;
 try{pollInput();if(window.PE&&PE.bot)PE.bot(IN);
  if(SCREEN==='raid'){if(R.paused){}else if(R.loot){if(IN.bag||IN.pause||IN.act){closeLoot();}IN.bag=IN.pause=IN.act=false;}else if(IN.pause&&!R.over){uiPause();}
   updRaid(dt);renderRaid();}
  syncTouch();endInput();}catch(err){window.__err=String(err&&err.stack||err);}
 requestAnimationFrame(frame);}
addEventListener('visibilitychange',()=>{if(document.hidden&&SCREEN==='raid'&&R&&!R.over&&!R.paused&&!R.loot)uiPause();});
buildMini();uiTitle();
window.PE={get R(){return R;},get SAVE(){return SAVE;},get SCREEN(){return SCREEN;},M,IN,keys,bot:null,go:goRaid,act:doAct,frame,step(n,dt){for(let i=0;i<n;i++){pollInput();if(PE.bot)PE.bot(IN);updRaid(dt||1/60);endInput();}},path:pathFind,los};
requestAnimationFrame(frame);


</script>
