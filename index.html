function getInput(i){const o={mx:0,my:0,grabE:false,work:false,dashE:false};

 for(const m of maps){if(keys[m.l])o.mx-=1;if(keys[m.r])o.mx+=1;if(keys[m.u])o.my-=1;if(keys[m.d])o.my+=1;
  if(m.grab.some(k=>pressed[k]))o.grabE=true;if(m.work.some(k=>keys[k]))o.work=true;if(m.dash.some(k=>pressed[k]))o.dashE=true;}

 if(pd){if(pd.mx||pd.my){o.mx=pd.mx;o.my=pd.my;}if(pd.grabE)o.grabE=true;if(pd.work)o.work=true;if(pd.dashE)o.dashE=true;}

function hitWall(x,y,hw,hh){for(const[ax,ay]of[[x-hw,y-hh],[x+hw,y-hh],[x-hw,y+hh],[x+hw,y+hh]]){if(solid(tileAt(Math.floor((ax-GX)/TS),Math.floor((ay-GY)/TS))))return true;}return false;}

function findTarget(p){const tries=[[p.dx,p.dy]];if(Math.abs(p.dx)>=Math.abs(p.dy))tries.push([Math.sign(p.dx)||1,0],[0,Math.sign(p.dy)]);else tries.push([0,Math.sign(p.dy)||1],[Math.sign(p.dx),0]);

function doGrab(p){const t=p.tgt;if(!t)return;const h=p.hold,ch=t.ch;
 if(BIN[ch]){if(!h){if(t.empty){say(t,'비었어요! 보충 필요','#ff8a80');sfx.bad();}else{p.hold={k:BIN[ch]};sfx.pick();}}
  else if(h.k==='supply'){if(t.empty){t.empty=false;p.hold=null;sfx.fix();say(t,'보충 완료!','#8ff0a4');endEvent('short');}else{sfx.bad();say(t,'아직 넉넉해요');}}
  else if(h.k===BIN[ch]){p.hold=null;sfx.put();}else sfx.bad();return;}
 if(ch==='B'){if(!h){p.hold={k:'crate',items:[],sealed:false};sfx.pick();}else if(h.k==='crate'&&!h.sealed&&!h.items.length){p.hold=null;sfx.put();}else sfx.bad();return;}
 if(ch==='W'){if(!h){p.hold={k:'supply'};sfx.pick();}else if(h.k==='supply'){p.hold=null;sfx.put();}else sfx.bad();return;}
 if(ch==='T'){if(h){p.hold=null;sfx.scrap();puff(tcx(t),tcy(t)-8,'#7d8a7f',6);}return;}
 if(ch==='X'){if(h&&h.k==='crate'&&h.sealed){p.hold=null;ship(h,t);}else if(h){sfx.bad();say(t,h.k==='crate'?'먼저 포장대에서 봉인!':'봉인한 상자만 출고해요','#ff8a80');}return;}
 if(ch==='E'){if(G.dark)say(t,'작업 키를 꾹!','#ffcf4a');return;}
 if(MACH[ch]){
  if(h){if(t.st==='idle'&&!t.item&&RAWS.includes(h.k)){t.item=h;p.hold=null;t.st='work';t.p=0;t.out=RECIPE[ch][h.k]||'scrap';sfx.put();sfx.mstart();if(t.out==='scrap')say(t,'이 기계엔 안 맞는 재료!','#ff8a80');}
   else if(t.st==='done'&&h.k==='crate'&&!h.sealed&&t.item.k!=='scrap'&&h.items.length<4){h.items.push(t.item.k);t.item=null;t.st='idle';t.heat=0;sfx.pick();}
   else{sfx.bad();if(t.st==='broken')say(t,'고장! 작업 키로 수리','#ff8a80');else if(!RAWS.includes(h.k))say(t,'원재료만 넣어요','#ff8a80');else say(t,'사용 중','#ff8a80');}}
  else{if(t.st==='done'){p.hold=t.item;t.item=null;t.st='idle';t.heat=0;sfx.pick();}else if(t.st==='work')say(t,'가공 중…');else if(t.st==='broken')say(t,'고장! 작업 키를 꾹','#ff8a80');}
  return;}
 if(holds(t)){const it=t.item;
  if(h&&!it){t.item=h;p.hold=null;t.off=0;t.p=0;sfx.put();return;}
  if(!h&&it){p.hold=it;t.item=null;t.p=0;t.off=0;sfx.pick();return;}
  if(h&&it){
   if(it.k==='crate'&&!it.sealed){if(isProd(h.k)){if(it.items.length<4){it.items.push(h.k);p.hold=null;t.p=0;sfx.put();}else{sfx.bad();say(t,'상자가 가득 찼어요','#ff8a80');}}else{sfx.bad();say(t,h.k==='scrap'?'불량품은 폐기통으로':RAWS.includes(h.k)?'가공한 물자만 담아요':'담을 수 없어요','#ff8a80');}return;}
   if(h.k==='crate'&&!h.sealed&&isProd(it.k)){if(h.items.length<4){h.items.push(it.k);t.item=null;sfx.pick();}else sfx.bad();return;}
   sfx.bad();}}}

function ship(cr,t){const key=crateKey(cr);let best=null;for(const o of G.orders)if(o.key===key&&(!best||o.t<best.t))best=o;
 const x=tcx(t),y=tcy(t);puff(x+20,y,'#cfd6e2',10);
 if(best){const n=cr.items.length;let pts=Math.round((20*n+10)*(1+.5*best.t/best.tmax)*(best.vip?2:1));G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);pts+=Math.min(30,(G.combo-1)*5);G.score+=pts;G.stats.ok++;
  G.orders.splice(G.orders.indexOf(best),1);floatAt(x-10,y-40,'+'+pts+(G.combo>1?'  ×'+G.combo+' 연속':''),C.yel2,true);sfx.ship();G.drops.push({t:0,vip:best.vip,dest:best.dest,sx:rnd(.25,.75)});}
 else{G.score=Math.max(0,G.score-15);G.combo=0;G.stats.wrong++;sfx.fail();G.shake=.3;floatAt(x-10,y-40,'오배송 -15',' #ff8a80'.trim(),true);}}

function spawnOrder(vip){const d=G.d,n=vip?Math.max(2,d.size[0]):rint(d.size[0],d.size[1]),pool=[],items=[];for(const k in d.prod)for(let i=0;i<d.prod[k];i++)pool.push(k);for(let i=0;i<n;i++)items.push(pick(pool));items.sort();
 const tm=(d.tmax+(n-d.size[0])*14)*(1+.1*G.up.time)*(vip?.7:1)*(G.solo?1.3:1);
 G.orders.push({id:++G.oid,items,key:items.join(','),t:tm,tmax:tm,dest:pick(d.dests),vip:!!vip,age:0});sfx.tick();}

function startEvent(type){const d=G.d;let ok=true;G.ev={type,t:0};
 if(type==='rush'){spawnOrder(true);G.ev=null;G.evT=rnd(d.evGap[0],d.evGap[1]);}
 else if(type==='break'){const ms=[];for(const row of G.tiles)for(const t of row)if(MACH[t.ch]&&t.st!=='broken')ms.push(t);if(!ms.length)ok=false;else{const t=pick(ms);t.prev=t.st;t.st='broken';t.rp=0;G.ev.tile=t;}}
 else if(type==='dark'){G.dark=true;}
 else if(type==='short'){const used={};for(const k in d.prod)used[SRC[k][0]]=1;const bs=[];for(const row of G.tiles)for(const t of row)if(BIN[t.ch]&&used[BIN[t.ch]]&&!t.empty)bs.push(t);if(!bs.length)ok=false;else{const t=pick(bs);t.empty=true;G.ev.tile=t;}}
 else if(type==='storm'){G.storm=18;}
 else if(type==='duck'){spawnDuck();}
 if(!ok){G.ev=null;G.evT=8;return;}
 banner(EVN[type][0],EVN[type][1],type==='rush'?'#c98600':C.red);sfx.alarm();}
function endEvent(type){if(G.ev&&G.ev.type===type){G.ev=null;G.evT=rnd(G.d.evGap[0],G.d.evGap[1]);}}

function pathTo(c0,r0,c1,r1){const key=(q,r)=>r*GC+q,prev=new Map(),qu=[[c0,r0]];prev.set(key(c0,r0),null);
 while(qu.length){const[q,r]=qu.shift();if(q===c1&&r===r1){const out=[];let k=key(q,r);while(k!==null&&k!==undefined){out.unshift([k%GC,Math.floor(k/GC)]);k=prev.get(k);}out.shift();return out;}
  for(const[dq,dr]of[[1,0],[-1,0],[0,1],[0,-1]]){const t=tileAt(q+dq,r+dr);if(t&&t.ch==='.'&&!prev.has(key(q+dq,r+dr))){prev.set(key(q+dq,r+dr),key(q,r));qu.push([q+dq,r+dr]);}}}
 return null;}
function floors(){const f=[];for(const row of G.tiles)for(const t of row)if(t.ch==='.')f.push(t);return f;}
function spawnDuck(){const fs=floors().filter(t=>G.players.every(p=>Math.hypot(p.x-(GX+t.c*TS+30),p.y-(GY+t.r*TS+34))>170));const t=pick(fs.length?fs:floors());
 G.duck={x:GX+t.c*TS+30,y:GY+t.r*TS+34,item:null,t:0,st:'run',path:[],life:17,face:1,goal:null};puff(G.duck.x,G.duck.y-10,'#fff3b0',10);sfx.quack();}
function updDuck(dt){const d=G.duck;if(!d)return;d.t+=dt;d.life-=dt;
 if(d.st!=='leave')for(const p of G.players){if(Math.hypot(p.x-d.x,p.y-d.y)<36){if(d.item){if(!p.hold)p.hold=d.item;else{let e=null,bd=1e9;for(const row of G.tiles)for(const t of row)if(t.ch==='='&&!t.item){const dd=Math.hypot(tcx(t)-d.x,tcy(t)-d.y);if(dd<bd){bd=dd;e=t;}}if(e)e.item=d.item;}d.item=null;floatAt(d.x,d.y-50,'되찾았다! +10','#8ff0a4',true);G.score+=10;}else floatAt(d.x,d.y-50,'훠이!','#fff');d.st='leave';d.life=.5;sfx.quack();break;}}
 if(d.st==='leave'){if(d.life<=0){puff(d.x,d.y-10,'#fff3b0',10);G.duck=null;endEvent('duck');}return;}
 if(d.life<=0){if(d.item){floatAt(d.x,d.y-50,'꽥! 물자를 들고 도망갔어요','#ff8a80',true);sfx.fail();}puff(d.x,d.y-10,'#fff3b0',10);G.duck=null;endEvent('duck');return;}
 const dc=Math.floor((d.x-GX)/TS),dr=Math.floor((d.y-GY)/TS);
 if(!d.path.length){let done=false;
  if(!d.item){const cs=[];for(const row of G.tiles)for(const t of row)if(holds(t)&&t.item)cs.push(t);
   for(let k=0;k<4&&cs.length&&!done;k++){const t=cs.splice(Math.floor(Math.random()*cs.length),1)[0];for(const[dq,dr2]of[[0,1],[0,-1],[1,0],[-1,0]]){const n=tileAt(t.c+dq,t.r+dr2);if(n&&n.ch==='.'){const p=pathTo(dc,dr,n.c,n.r);if(p){d.path=p;d.goal=t;done=true;break;}}}}}
  if(!done){d.goal=null;const fs=floors();for(let k=0;k<6;k++){const t=pick(fs),p=pathTo(dc,dr,t.c,t.r);if(p&&p.length){d.path=p;break;}}}
  if(!d.path.length&&d.goal&&d.goal.item&&!d.item){d.item=d.goal.item;d.goal.item=null;d.goal.p=0;d.goal=null;sfx.quack();floatAt(d.x,d.y-50,'꽥!','#ffd23a',true);}}
 if(d.path.length){const[q,r]=d.path[0],tx=GX+q*TS+30,ty=GY+r*TS+34,dx=tx-d.x,dy=ty-d.y,dist=Math.hypot(dx,dy),sp=(d.item?175:145)*dt;
  if(dist<=sp){d.x=tx;d.y=ty;d.path.shift();if(!d.path.length&&d.goal){if(d.goal.item&&!d.item){d.item=d.goal.item;d.goal.item=null;d.goal.p=0;sfx.quack();floatAt(d.x,d.y-50,'꽥!','#ffd23a',true);}d.goal=null;}}
  else{d.x+=dx/dist*sp;d.y+=dy/dist*sp;if(Math.abs(dx)>1)d.face=dx<0?-1:1;}}}

function updPlayer(p,dt){const inp=getInput(p.i);p.t+=dt;
 const sp=205*(1+.08*G.up.speed),ice=G.d.ice;let mx=inp.mx,my=inp.my;const mag=Math.hypot(mx,my);
 if(mag>0){mx/=Math.max(1,mag);my/=Math.max(1,mag);p.dx=inp.mx/mag;p.dy=inp.my/mag;p.face=Math.abs(mx)>=Math.abs(my)?(mx<0?'l':'r'):(my<0?'u':'d');}
 p.dashCd-=dt;p.dashT-=dt;
 if(inp.dashE&&p.dashCd<=0){p.dashT=.16;p.dashCd=.55;sfx.dash();puff(p.x,p.y-6,'#cfd6e2',5);if(mag===0){mx=p.dx;my=p.dy;}}
 const boost=p.dashT>0?2.5:1;let tvx=mx*sp*boost,tvy=my*sp*boost;if(p.dashT>0&&mag===0){tvx=p.dx*sp*boost;tvy=p.dy*sp*boost;}
 const k=ice?(mag>0||p.dashT>0?5.5:3.2):20;p.vx+=(tvx-p.vx)*Math.min(1,k*dt);p.vy+=(tvy-p.vy)*Math.min(1,k*dt);
 moveC(p,dt);p.moving=Math.hypot(p.vx,p.vy)>30;if(p.moving)p.walk+=dt*15;
 p.tgt=findTarget(p);
 if(inp.grabE){doGrab(p);p.auto=null;}
 let wt=null;const act=!G.solo||p.i===G.active;
 if(act){if(inp.work&&workable(p.tgt)){wt=p.tgt;p.auto=wt;}else p.auto=null;}
 else if(p.auto&&workable(p.auto))wt=p.auto;else p.auto=null;
 p.working=wt;if(wt)wt.w++;}

function update(dt){
 if(G.cnt>0){G.cnt-=dt;const n=Math.ceil(G.cnt-.6);if(n!==G.cntN&&n>=1){G.cntN=n;sfx.cnt();}if(G.cnt<=.6&&G.cntN!==0){G.cntN=0;sfx.go();MUS.on=true;}if(G.cnt>.6){for(const p of G.players)p.t+=dt;return;}}
 G.t+=dt;G.left-=dt;if(G.left<=0){G.left=0;endLevel();return;}
 MUS.tempo=G.left<30?146:124;const sec=Math.ceil(G.left);if(sec<=10&&sec!==G.lastSec){G.lastSec=sec;sfx.cnt();}
 if(G.solo&&(pressed.Tab||pressed.KeyR||(PAD[0]&&PAD[0].swapE)||TCH.swapE)){G.active^=1;sfx.click();const p=G.players[G.active];puff(p.x,p.y-60,C.yel2,5);}
 for(const row of G.tiles)for(const t of row)t.w=0;
 for(const p of G.players)updPlayer(p,dt);
 const a=G.players[0],b=G.players[1],dd=Math.hypot(a.x-b.x,a.y-b.y);if(dd<26&&dd>0.01){const ox=(a.x-b.x)/dd*(26-dd)/2,oy=(a.y-b.y)/dd*(26-dd)/2;if(!hitWall(a.x+ox,a.y+oy,15,12)){a.x+=ox;a.y+=oy;}if(!hitWall(b.x-ox,b.y-oy,15,12)){b.x-=ox;b.y-=oy;}}
 // tiles
 for(const row of G.tiles)for(const t of row){
  if(t.w>0){if(t.ch==='K'&&workable(t)){t.p+=dt*t.w*(1+.25*G.up.pack)/1.6;if(t.p>=1){t.item.sealed=true;t.p=0;sfx.seal();puff(tcx(t),tcy(t)-10,'#ffe9a8',10);}}
   else if(MACH[t.ch]&&t.st==='broken'){t.rp+=dt*t.w/2.5;if(t.rp>=1){t.st=t.prev;t.rp=0;sfx.fix();say(t,'수리 완료!','#8ff0a4');endEvent('break');}}
   else if(t.ch==='E'&&G.dark){t.p+=dt*t.w/3;if(t.p>=1){G.dark=false;t.p=0;sfx.power();say(t,'전력 복구!','#8ff0a4');endEvent('dark');}}}
  if(MACH[t.ch]&&!G.dark){
   if(t.st==='work'){t.p+=dt*(1+.15*G.up.machine)/3.5;if(t.p>=1){t.st='done';t.item={k:t.out};t.heat=0;t.p=0;if(t.out==='scrap'){sfx.scrap();G.stats.scrap++;say(t,'불량품…','#ff8a80');}else sfx.ding();}}
   else if(t.st==='done'&&t.item&&t.item.k!=='scrap'){t.heat+=dt;if(t.heat>18){t.item={k:'scrap'};sfx.scrap();G.stats.scrap++;say(t,'과열! 불량품이 됐어요','#ff8a80');}}}
  if(t.belt&&t.item&&!G.dark){const[dx,dy]=DIRV[t.belt],n=tileAt(t.c+dx,t.r+dy),nb=n&&n.belt?n:null,lim=nb?(nb.item?.15:1):0;
   if(t.off<lim)t.off=Math.min(lim,t.off+dt*2.2);if(nb&&!nb.item&&t.off>=1){nb.item=t.item;nb.off=-1;t.item=null;t.off=0;}}
 }
 // orders
 const rate=G.storm>0?1.7:1;
 for(let i=G.orders.length-1;i>=0;i--){const o=G.orders[i];o.age+=dt;o.t-=dt*rate;if(o.t<=0){G.orders.splice(i,1);G.score=Math.max(0,G.score-15);G.combo=0;G.stats.miss++;sfx.fail();G.shake=.25;floatAt(520,150,'보급 실패! '+o.dest+'  -15','#ff8a80',true);}}
 G.ordT-=dt;if(!G.orders.length&&G.ordT>1.2)G.ordT=1.2;
 if(G.ordT<=0&&G.left>12){if(G.orders.length<G.d.maxO){spawnOrder(false);G.ordT=G.d.gap*(G.t<25?.6:1);}else G.ordT=2;}
 // events
 if(G.storm>0){G.storm-=dt;if(G.storm<=0)endEvent('storm');}
 if(!G.ev){G.evT-=dt;if(G.evT<=0&&G.left>22)startEvent(pick(G.d.events));}
 updDuck(dt);
 for(let i=G.drops.length-1;i>=0;i--){G.drops[i].t+=dt;if(G.drops[i].t>6.5)G.drops.splice(i,1);}
 for(let i=G.fx.length-1;i>=0;i--){const f=G.fx[i];f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=60*dt;if(f.life<=0)G.fx.splice(i,1);}
 for(let i=G.fl.length-1;i>=0;i--){const f=G.fl[i];f.t+=dt;if(f.t>(f.big?1.6:1.1))G.fl.splice(i,1);}
 if(G.banner){G.banner.t+=dt;if(G.banner.t>3.2)G.banner=null;}
 if(G.shake>0)G.shake-=dt;
 G.hintT-=dt;if(G.hintT<=0){G.hintT=.3;G.hint=hintText();}}

function hintText(){if(G.dark)return'정전! 발전기 앞에서 작업 키를 꾹 눌러 전력을 복구하세요';
 if(G.ev&&G.ev.type==='break')return'기계 고장! 고장 난 기계 앞에서 작업 키를 꾹 눌러 수리하세요';
 if(G.ev&&G.ev.type==='short')return'재료 부족! 팔레트(보충)에서 자재를 꺼내 빈 통에 넣으세요';
 if(G.duck)return'오리가 물자를 노려요! 몸으로 부딪혀서 쫓아내세요';
 if(!G.orders.length)return'주문을 기다리는 중… 미리 물자를 만들어 두면 좋아요';
 const o=G.orders.reduce((a,b)=>a.t<b.t?a:b),crates=[];for(const row of G.tiles)for(const t of row)if(t.item&&t.item.k==='crate')crates.push(t.item);for(const p of G.players)if(p.hold&&p.hold.k==='crate')crates.push(p.hold);
 const match=c=>G.orders.some(q=>q.key===crateKey(c));
 if(crates.some(c=>c.sealed&&match(c)))return'④ 봉인한 상자를 오른쪽 출고 컨베이어에 올리면 에어드랍!';
 if(crates.some(c=>!c.sealed&&match(c)))return'③ 상자를 포장대에 올리고 작업 키를 꾹 눌러 봉인하세요';
 const sub=(c,q)=>{const need=q.items.slice();for(const k of c.items){const i=need.indexOf(k);if(i<0)return false;need.splice(i,1);}return true;};
 if(crates.some(c=>!c.sealed&&c.items.length&&!G.orders.some(q=>sub(c,q))))return'상자에 주문과 안 맞는 물자가 있어요. 폐기통에 버리고 새 상자에 다시 담으세요';
 if(!crates.some(c=>!c.sealed)){if(crates.some(c=>c.sealed))return'봉인한 상자가 지금 주문과 달라요. 폐기통에 버리고 새 상자를 꺼내세요';return'① 빈 상자 더미에서 상자를 꺼내 포장대에 올려 두세요';}
 const cr=crates.find(c=>!c.sealed),tgt=G.orders.filter(q=>sub(cr,q)).sort((a,b)=>a.t-b.t)[0]||o,have=cr.items.slice(),need=tgt.items.filter(k=>{const i=have.indexOf(k);if(i>=0){have.splice(i,1);return false;}return true;}),k=need[0]||tgt.items[0];
 return'② '+ITEM[k].n+' 만들기: '+ITEM[SRC[k][0]].n+' 통 → '+MACH[SRC[k][1]]+' → 상자에 담기';}

function endLevel(){G.over=true;MUS.on=false;let s=0;for(const v of G.th)if(G.score>=v)s++;
 const prev=SAVE.stars[G.li]||0,gain=Math.round(G.score/10)+Math.max(0,s-prev)*20,oldLv=factoryLv();SAVE.bp+=gain;SAVE.stars[G.li]=Math.max(prev,s);SAVE.best[G.li]=Math.max(SAVE.best[G.li]||0,G.score);save();
 RES={stars:s,gain,t:0,lvUp:factoryLv()>oldLv,li:G.li,solo:G.solo,score:G.score,stats:G.stats,maxCombo:G.maxCombo,th:G.th};go('result');if(s)sfx.star();else sfx.fail();}
